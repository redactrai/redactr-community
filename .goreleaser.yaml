version: 2
builds:
  - main: ./cmd/redactr-community
    binary: redactr-community
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
archives:
  - formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
