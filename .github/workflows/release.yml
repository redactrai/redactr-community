name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Embed Windows .exe icon
        run: go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0 -o cmd/redactr-community/resource_windows_amd64.syso cmd/redactr-community/versioninfo.json
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
