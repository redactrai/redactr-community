name = "redactr-telemetry"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Aggregate store (country/city/version/os + rotating session id). No PII, no IP.
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "redactr_community_heartbeats"

# Per-IP rate limiting. The IP is used only as the transient limiter key — never stored.
# period must be 10 or 60 (seconds). namespace_id is any unique integer for this limiter.
[[ratelimits]]
binding = "BEAT_LIMIT"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
